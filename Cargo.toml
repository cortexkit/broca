[workspace]
resolver = "2"
members = [
    "crates/broca-protocol",
    "crates/broca-owner-only",
    "crates/broca-ck",
    "crates/broca-provider",
    "crates/broca-core",
    "crates/broca-bench",
    "crates/broca-replay",
    "crates/broca-subc",
    "crates/broca-wal",
    "crates/broca-records",
    "crates/broca-wal-reader",
    "crates/broca-store",
    "crates/broca-store-contention-tests",
    "crates/broca-catalog",
    "crates/broca-module",
    "crates/broca-wire",
    "crates/broca-module-serve",
    "crates/ck-session-import",
    "crates/ck-import",
    "crates/broca-test-support",
    "crates/broca-fetch-plan",
    "crates/broca-diagnostics",
    "crates/broca-heap-profile",
    "crates/broca-memory-relief",
    "crates/broca-session-store",
    "crates/broca-session-loop",
]
# The session store's fuzz targets build on nightly with cargo-fuzz, in a workspace of their
# own, so the normal build, the gate and CI never build them.
exclude = ["crates/broca-session-store/fuzz"]

# broca workspace.
# - crates/broca-protocol : canonical types ONLY (no IO). The provider<->runner
#   stream-part schema, the runner<->caller control-unit schema, the framed
#   two-lane OutputStream envelope, the error taxonomy, Usage, cache-tier
#   markers. This crate defines the shared wire contract.
# - crates/broca-provider  : wire-family renderers, normalizers, and live provider
#   transports. Its producer binary also serves the process-separated benchmark.
# - crates/broca-core      : the agentic run loop, model steps, tool dispatch, and
#   WAL-backed resume.
# - crates/broca-subc      : daemon connections and adapters for tool routing,
#   compaction, and hooks.
# - crates/broca-bench     : the (A) latency/jitter test bench — in-process vs
#   process-separated, deterministic SSE replay, CLOCK_MONOTONIC one-way timing.
#
# Linked fleet crates are registry releases or immutable git revisions. Sibling
# checkouts are used only to build integration-test rig binaries.

[workspace.package]
version = "0.4.91"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/cortexkit/broca"

[workspace.dependencies]
broca-owner-only = { path = "crates/broca-owner-only" }
cortexkit-anthropic-policy = "=0.1.4"
cortexkit-chatgpt-policy = "=0.1.0"
serde = { version = "1", features = ["derive", "rc"] }
# Keep shared normal-dependency features identical across package selections.
# Tokio's paused-clock support is deliberately dev-only: test-util adds clock
# synchronization to Instant::now(), including in builds that never pause time.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
serde_jcs = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"
sha2 = "0.10"
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f", default-features = false, features = ["deflate"] }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", default-features = false, features = ["handshake", "connect", "rustls-tls-webpki-roots"] }
# Exact released versions keep the benchmark and production on the same envelope.
subc-protocol = "=0.37.5"
subc-transport = "=0.18.0"
subc-control = "=0.42.2"
subc-config = "=0.1.4"
subc-jsonc = "=0.1.3"
subc-client-rs = "=0.41.4"
subc-os = "=0.1.43"
cortexkit-lease = "=0.1.2"
cortexkit-log = "=0.3.5"
cortexkit-role-harness = "=0.1.0"
cortexkit-role-tool-provider = "=0.15.17"
cortexkit-llm-tools = "=0.3.0"
cortexkit-role-tool-provider-conformance = "=0.15.18"
cortexkit-role-llm-runner = "=0.9.0"
# Recorded v1 requests must keep the exact tag-rendering bytes of their original contract.
cortexkit-role-llm-runner-v1 = { package = "cortexkit-role-llm-runner", version = "=0.7.48" }
cortexkit-bus-naming = "=0.5.5"
cortexkit-bus-trait = "=0.3.1"
cortexkit-bus-nats = "=0.5.5"
cortexkit-role-llm-runner-conformance = "=0.17.81"
# Draft 2020-12 validation of structured-output values. Default features are off so the
# validator has no HTTP or file retriever: a schema can never make broca fetch anything.
jsonschema = { version = "=0.58.6", default-features = false }
# Time zones for keep-warm windows (`plan.cache.hours.tz`). The bundled IANA database, never the
# host's, so a zone one machine accepts is accepted on every machine a session can move to.
jiff = { version = "=0.2.39", default-features = false, features = ["std", "tzdb-bundle-always"] }
cortexkit-role-agent-data = "=0.3.4"
cortexkit-role-step-transform-provider = "=0.5.1"
cortexkit-role-compaction-provider = "=0.7.14"
cortexkit-role-compaction = "=0.4.9"
cortexkit-tokens = "0.1.0"
cortexkit-compaction-view = "=0.4.0"
# System One: the one-pass decision-model role and the batch rules it shares with extraction.
cortexkit-role-classifier = "=0.6.3"
cortexkit-role-classifier-conformance = "=0.8.3"
cortexkit-role-routing = "=0.7.40"
cortexkit-model-batch = "=0.3.4"

# The logging facade every crate here emits through. The records are formatted and
# written by cortexkit-log, which the daemon binary installs as the process-global
# subscriber; a process that installs none simply drops them. Declared once so every
# crate binds ONE tracing instance -- two would mean two independent global
# subscribers, and half the module's records landing nowhere.
tracing = "0.1"

# Codex's client fork references tungstenite over SSH; resolve the same immutable source via HTTPS.
[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch.crates-io]
# JetStream's retry dependency must not enable Tokio's production test clock.
# third_party/tryhard is a vendored copy of commons' fork at fe59258998db (see its
# CORTEXKIT.md). It is vendored rather than a git source so builds never clone
# commons; a crates.io patch can't replace a crates.io crate. Remove once upstream
# drops test-util.
tryhard = { path = "third_party/tryhard" }

# Cargo already defaults to unwinding; pinning it makes that a decision rather
# than an inherited property. broca serves each run on its own task, so an
# unwind contains a panic to one run: the actor's drop guard seals the episode,
# the lease releases, and the daemon keeps serving every other session. Under
# `panic = "abort"` the same panic takes the process down mid-turn, which for
# this module is a durability event — an in-flight WAL append and its fsync
# barrier are lost, and every live session's turn dies with it. A build-tuning
# change flipping this would be invisible to the test suite, so it is pinned
# here with the reason attached.
[profile.dev]
panic = "unwind"

# Test rigs hash full debug executables before launching their dev-named copies.
# Optimize hashing so repeated rig startups do not dominate integration test time.
[profile.dev.package.broca-test-support]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
panic = "unwind"
