name: Windows native release suites

# Keep this check separate from required CI while the native test lanes are being ported.
on:
  push:
    branches: [master, 'train/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Native release suites (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            host: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            host: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
      BROCA_REQUIRE_SUBC: '1'
      BROCA_REQUIRE_SUBC_GATE: '1'
      BROCA_REQUIRE_AIMOCK: '1'
      BROCA_REQUIRE_VAULT: '1'
      BROCA_REQUIRE_UPGRADE_SUBC: '1'
      BROCA_REQUIRE_CINGULATE: '1'
      BROCA_REQUIRE_CEREBELLUM: '1'
      CK_BUS_TESTKIT_REQUIRE: '1'
      SUBC_CORE_BIN: ${{ github.workspace }}/subconscious/target/debug/ck-subc.exe
      SUBC_GATE_CORE_BIN: ${{ github.workspace }}/subconscious/target/debug/ck-subc.exe
      FAKE_AFT_STUB_BIN: ${{ github.workspace }}/subconscious/target/debug/fake-aft-stub.exe
      FAKE_SURFACE_BIN: ${{ github.workspace }}/fake-surface-target/debug/fake-surface.exe
      CK_CLAUSTRUM_BIN: ${{ github.workspace }}/claustrum/target/debug/ck-claustrum.exe
      CK_AUTH_BIN: ${{ github.workspace }}/claustrum/target/debug/ck-auth.exe
      CK_CLAUSTRUM_CHECKOUT: ${{ github.workspace }}/claustrum
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: broca
      - name: Load the push CI fixture pins
        run: |
          source broca/scripts/ci-fixture-revisions.conf
          [[ "$SUBC_REV" =~ ^[a-f0-9]{40}$ && "$CLAUSTRUM_REV" =~ ^[a-f0-9]{40}$ ]]
          printf 'SUBC_REV=%s\nCLAUSTRUM_REV=%s\n' "$SUBC_REV" "$CLAUSTRUM_REV" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: cortexkit/subconscious
          ref: ${{ env.SUBC_REV }}
          path: subconscious
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: cortexkit/claustrum
          ref: ${{ env.CLAUSTRUM_REV }}
          path: claustrum
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable-${{ matrix.host }}
      - name: Verify the native Rust host
        env:
          RUST_HOST: ${{ matrix.host }}
        run: |
          rustc -vV
          [[ "$(rustc -vV | tr -d '\r' | awk '/^host:/ {print $2}')" == "$RUST_HOST" ]]
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            broca -> target
            subconscious -> target
            claustrum -> target
          key: native-windows-${{ matrix.arch }}
          cache-on-failure: 'true'
      - name: Build the pinned daemon, vault and stand-in rigs
        run: |
          nice -n 10 env CARGO_INCREMENTAL=0 cargo build --locked --manifest-path subconscious/Cargo.toml -p subc-core --features test-support --bin ck-subc --bin ck --bin fake-aft-stub
          nice -n 10 env CARGO_INCREMENTAL=0 cargo build --locked --manifest-path claustrum/Cargo.toml -p credentials-module --bin ck-claustrum --bin ck-auth
          nice -n 10 env CARGO_INCREMENTAL=0 cargo build --locked --manifest-path broca/crates/broca-module-serve/tests/support/fake-surface/Cargo.toml --target-dir fake-surface-target
          for fixture in "$SUBC_CORE_BIN" "$FAKE_AFT_STUB_BIN" "$FAKE_SURFACE_BIN" "$CK_CLAUSTRUM_BIN" "$CK_AUTH_BIN"; do
            test -s "$fixture"
          done
          printf 'SUBC pin: %s (%s)\n\nVault pin: %s (%s)\n\n' \
            "$SUBC_REV" "$("$SUBC_CORE_BIN" --version)" \
            "$CLAUSTRUM_REV" "$("$CK_CLAUSTRUM_BIN" --version)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install aimock
        working-directory: broca
        run: npm ci
      - name: Restore the pinned NATS archive
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/nats-cache
          key: nats-server-v2.10.26-${{ runner.os }}-${{ runner.arch }}
      - name: Install the native NATS broker
        working-directory: broca
        run: python3 scripts/install-ci-nats.py --cache-dir "$RUNNER_TEMP/nats-cache" --machine "$RUNNER_ARCH"
      - name: Run every native lane
        working-directory: broca
        run: bash scripts/native-release-windows.sh "$RUNNER_TEMP/native-release-logs"
      - name: Upload native logs and process cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release-windows-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/native-release-logs
            broca/target/rig-survivors/*.txt
          if-no-files-found: ignore
