name: Release

# Internal deploys push v* tags, but only an explicit dispatch publishes one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Already tagged broca version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

# Only one release may check for prior releases and publish at a time.
concurrency:
  group: public-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  TAG: v${{ inputs.version }}

jobs:
  gate:
    if: github.repository == 'cortexkit/broca'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require landed commit and green push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-ci-gate.sh "$GITHUB_SHA"

  verify:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Match the existing tag, dispatched commit, crate version, notes and manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release/release.py version "$VERSION"
          git fetch --no-tags origin "refs/tags/$TAG"
          tag_commit=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          dispatch_commit=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          if [[ $tag_commit != "$dispatch_commit" ]]; then
            echo "::error::$TAG does not point at the dispatched commit"
            exit 1
          fi
          python3 scripts/release/release.py inputs "$VERSION"

  draft:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Create an unpublished release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/github-assets.sh draft

  build:
    name: Build ${{ matrix.platform }}
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      # Check each shipping binary separately; test builds may unify dev-only features.
      - name: Check standalone binaries and build without dev features
        run: |
          cargo check --locked -p broca-module-serve --bin ck-broca --target "$TARGET"
          cargo check --locked -p broca-module-serve --bin broca-session --target "$TARGET"
          cargo build --locked --release -p broca-module-serve --bin ck-broca --bin broca-session --target "$TARGET"
      - name: Sign, notarize and checksum macOS ZIPs
        if: runner.os == 'macOS'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: bash scripts/release/macos-sign-notarize.sh "target/$TARGET/release" dist "$PLATFORM" "$VERSION"
      - name: Smoke-test and package Linux and Windows binaries
        if: runner.os != 'macOS'
        run: |
          mkdir dist
          for binary in ck-broca broca-session; do
            archive="$binary-$PLATFORM.zip"
            executable="$binary"
            if [[ $RUNNER_OS == Windows ]]; then executable+=.exe; fi
            if [[ $("./target/$TARGET/release/$executable" --version) != "$binary $VERSION" ]]; then
              echo "::error::$executable does not report version $VERSION"
              exit 1
            fi
            if [[ $RUNNER_OS == Windows ]]; then
              ( cd "target/$TARGET/release" && 7z a -tzip "../../../dist/$archive" "$executable" )
            else
              zip -q -j "dist/$archive" "target/$TARGET/release/$executable"
            fi
            ( cd dist && sha256sum "$archive" > "$archive.sha256" )
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  verify-assets:
    name: Upload to draft and verify downloaded assets
    needs: [draft, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          pattern: release-*
          merge-multiple: true
      - name: Verify the exact asset inventory and hashes from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: bash scripts/release/github-assets.sh verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-inventory
          path: verified-assets/inventory.txt
          if-no-files-found: error

  publish:
    needs: [draft, verify-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-inventory
          path: verified-assets
      - name: Publish only the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: bash scripts/release/github-assets.sh publish
