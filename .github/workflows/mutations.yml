name: Mutation catalogue

permissions:
  contents: read

on:
  push:
    branches: [master, 'train/**']
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  # A push must not cancel the nightly breadth audit on the same branch.
  group: mutations-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Same as ci.yml: full debuginfo fills a GitHub-hosted runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CK_MUTATE_REV: 0c99c7e16d8ae22b6e114136b6b7b68be6f1394e
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  mutation-platforms:
    name: Mutation test platform preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: broca
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check catalogue platforms and regression fixtures
        working-directory: broca
        run: |
          python3 scripts/verify-mutation-platforms.py
          python3 scripts/verify-mutation-platforms.py --self-test

  mutations:
    needs: mutation-platforms
    name: Mutation catalogue (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The whole catalogue replayed in one job took about 39 minutes on this runner
        # (about 50 s per row, most of it rebuilding). Four shards split the rows so each
        # job replays about a quarter; every shard still builds the fixtures once.
        shard: [1, 2, 3, 4]
    env:
      # The breadth audit includes the same real-daemon/vault arms as the test job.
      # Missing fixtures must fail, never subtract those proofs through a green skip.
      BROCA_REQUIRE_SUBC: "1"
      BROCA_REQUIRE_VAULT: "1"
      BROCA_REQUIRE_AIMOCK: "1"
      SUBC_CORE_BIN: ${{ github.workspace }}/subconscious/target/debug/ck-subc
      FAKE_AFT_STUB_BIN: ${{ github.workspace }}/subconscious/target/debug/fake-aft-stub
      CK_CLAUSTRUM_BIN: ${{ github.workspace }}/claustrum/target/debug/ck-claustrum
      CK_AUTH_BIN: ${{ github.workspace }}/claustrum/target/debug/ck-auth
    defaults:
      run:
        working-directory: broca
    steps:
      # Same as ci.yml: the build and fixtures need more than the runner's default free space.
      - name: Free runner disk
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: broca
          fetch-depth: 0
      # Same fixture checkouts/builds as the integration job in ci.yml. subc-core's
      # bins include the ck CLI used to send the real module restart command.
      - name: Checkout subconscious
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: cortexkit/subconscious
          path: subconscious
      - name: Checkout claustrum
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: cortexkit/claustrum
          path: claustrum
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            broca/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-mutations-${{ hashFiles('broca/Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-mutations-
      - name: Build subc binaries (real-subc spine tests)
        working-directory: subconscious
        run: cargo build -p subc-core --bins
      - name: Build claustrum binaries (credential e2e arms)
        working-directory: claustrum
        run: cargo build -p credentials-module --bins
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - name: Validate catalogue
        run: ckdev-mutate check
      - name: Replay selected proofs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/mutations
          if [[ "$EVENT" == schedule ]]; then
            ckdev-mutate run --all --broad --shard "$SHARD/4" --report target/mutations/broad.json
          elif [[ "$EVENT" == workflow_dispatch || ( "$EVENT" == push && "$REF" == refs/heads/master ) ]]; then
            ckdev-mutate run --all --shard "$SHARD/4" --report target/mutations/all.json
          else
            base="${PR_BASE:-${PUSH_BASE:-}}"
            # A new train branch has an all-zero before SHA; compare against master.
            if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
              base=origin/master
            fi
            ckdev-mutate run --diff "$base" --shard "$SHARD/4" --report target/mutations/diff.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-${{ github.event_name }}-shard-${{ matrix.shard }}
          path: broca/target/mutations/*.json

  mutations-windows:
    needs: mutation-platforms
    name: Mutation catalogue (native Windows shard ${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      BROCA_REQUIRE_SUBC: "1"
      BROCA_REQUIRE_VAULT: "1"
      BROCA_REQUIRE_AIMOCK: "1"
      SUBC_CORE_BIN: ${{ github.workspace }}/subconscious/target/debug/ck-subc.exe
      FAKE_AFT_STUB_BIN: ${{ github.workspace }}/subconscious/target/debug/fake-aft-stub.exe
      CK_CLAUSTRUM_BIN: ${{ github.workspace }}/claustrum/target/debug/ck-claustrum.exe
      CK_AUTH_BIN: ${{ github.workspace }}/claustrum/target/debug/ck-auth.exe
      CK_CLAUSTRUM_CHECKOUT: ${{ github.workspace }}/claustrum
    defaults:
      run:
        working-directory: broca
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: broca
          fetch-depth: 0
      - name: Checkout subconscious
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: cortexkit/subconscious
          path: subconscious
      - name: Checkout claustrum
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: cortexkit/claustrum
          path: claustrum
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            broca/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-mutations-${{ hashFiles('broca/Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-mutations-
      - name: Build subc binaries (real-subc spine tests)
        working-directory: subconscious
        run: cargo build -p subc-core --bins
      - name: Build claustrum binaries (credential e2e arms)
        working-directory: claustrum
        run: cargo build -p credentials-module --bins
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate.exe
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - name: Validate catalogue
        run: ckdev-mutate check
      - name: Test Windows report verifier
        run: python3 scripts/verify-windows-mutations.py --self-test
      - name: Select Windows proofs
        id: windows-selection
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p target/mutations
          # Cached target directories must not supply reports from an earlier replay.
          rm -f target/mutations/windows-*.json
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch || ( "$EVENT" == push && "$REF" == refs/heads/master ) ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            python3 scripts/verify-windows-mutations.py --all --shard "$SHARD/4" --write-selection target/mutations/windows-selection.json
          else
            base="${PR_BASE:-${PUSH_BASE:-}}"
            if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
              base=origin/master
            fi
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
            python3 scripts/verify-windows-mutations.py --diff "$base" --shard "$SHARD/4" --write-selection target/mutations/windows-selection.json
          fi
      - name: Replay selected Windows proofs
        env:
          MODE: ${{ steps.windows-selection.outputs.mode }}
          BASE: ${{ steps.windows-selection.outputs.base }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == all ]]; then
            ckdev-mutate run --all --shard "$SHARD/4" --report target/mutations/windows-replay.json
          else
            ckdev-mutate run --diff "$BASE" --shard "$SHARD/4" --report target/mutations/windows-replay.json
          fi
      - name: Require complete native Windows coverage
        if: always()
        run: python3 scripts/verify-windows-mutations.py --selection target/mutations/windows-selection.json --report target/mutations/windows-replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-windows-${{ github.event_name }}-shard-${{ matrix.shard }}
          path: broca/target/mutations/windows-*.json
          if-no-files-found: error
