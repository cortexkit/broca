# Exclude daemon/vault/mock-dependent tests only from the cheap preflight.
# CI still requires the full daemon/vault/mock lanes;
# scripts/gate.sh retains native Mac daemon/vault/mock coverage.
# scripts/test-portable-test-selection.py checks test-level rig use against nextest's result.
# Private NATS tests need no sibling fixtures and remain selected; provision nats-server for them.
portable_unit_exclusions=(
  executor::tests::session_close_releases_hook_and_compaction_routes
  vault::tests::list_scoped_strict_mirror_matches_claustrum_tip
)
