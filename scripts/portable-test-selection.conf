  and not test(/(real_module_e2e::|aimock_guard::|all_families_smoke::|anthropic_e2e::|bedrock_e2e::|gemini_e2e::|mixed_family_concurrency_e2e::|openai_chat_e2e::|openai_responses_e2e::|stream_errors_e2e::|tool_arg_errors_e2e::|transport_errors_e2e::|account_selection_real_daemon::|captured_replay_e2e::|graceful_stop_real_daemon::|launch_nonce_e2e::|plan_fetch_real_daemon::|preset_real_daemon::|reply_deadline_real_daemon::|send_tool_reply_real_daemon::|step_transforms::|scope_real_daemon_e2e::|seal_line_is_filterable_e2e::|approval_gate::|single_turn_module_e2e::|retention_consent_wire::|real_daemon::two_real_daemons_|renderer_version_resume_real_daemon::)/)
