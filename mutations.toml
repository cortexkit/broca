# Safety proofs for crash recovery, authorization, wire compatibility and retained data.
# Replay serially with cortexkit-mutate 0.8.0 (binary ckdev-mutate). Reports live in
# target/mutations/.
# Use the runner's default build/test deadlines; do not calibrate budgets on a workstation.
# only = false allows other tests of the same property in that test target to fail
# on the break without failing the row. A cross-target catch is a test in a different
# target of the package going red; the nightly --broad audit reports those catches.
# hub marks a break deliberately caught by several targets asserting a shared property.
# Add it only after a broad replay shows those targets, with that property as its reason.

[[control]]
