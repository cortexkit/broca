# nextest only drives the integration-test slice of the Rust gate.
# Unit and binary tests stay on libtest so they do not fan out into hundreds of
# short-lived processes.
[profile.default]
retries = 0
fail-fast = true
# Keep two cores free for the rest of the workstation while the integration
# suite fans out locally. CI overrides this via NEXTEST_TEST_THREADS.
test-threads = -2

[profile.ci]
inherits = "default"
retries = 0
# CI is the only place Windows runs, and one run takes about half an hour, so report every
# failing test instead of stopping at the first. Local runs keep fail-fast.
fail-fast = false
# A passed test with inherited output handles still open is a cleanup failure.
leak-timeout = { period = "2s", result = "fail" }
# Allow slow provider disconnect tests, but terminate a stuck test after five minutes.
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
# These families spawn enough subprocesses that they need their own caps even
# when the wider integration suite runs in parallel.
subc_spine = { max-threads = 2 }
module_serve = { max-threads = 2 }
aimock = { max-threads = 4 }

[[profile.default.overrides]]
# The real-daemon spine tests boot subc-core plus supervised modules per test.
# Group them so multiple daemon stacks do not thrash the host at once. Apart
# from live_e2e they share the crate's `it` binary and are selected by module
# prefix. A prefix that matches nothing is not a nextest error, so
# scripts/test-nextest-groups.py checks that every prefix names a module of the
# binary and that every module starting a daemon rig is listed here.
filter = 'package(=broca-subc) and (binary(=live_e2e) or (binary(=it) and test(/^(aimock_real_aft|compaction_routes|consent_ops|dogfood|hook_routes|multi_module_spine|resume_spine|scope_outbound_real_daemon|tool_call_cancel_real_daemon|tool_fault_spine)::/)))'
test-group = 'subc_spine'

[[profile.default.overrides]]
# Module-serving integration tests boot multiple real processes per test
# (aimock, subc-core, the serve binary, and client helpers). ck-import's
# real_module_e2e is a module of that crate's `it` binary, so it is selected by
# test-name prefix; check a change with `cargo nextest list -E '<filter>'`.
filter = '(package(=broca-module-serve) and kind(test)) or (package(=ck-import) and binary(=it) and test(/^real_module_e2e::/))'
test-group = 'module_serve'

[[profile.default.overrides]]
# The mixed-family test boots five aimock processes at once, one per family, so
# it takes every slot of the aimock group and runs while no other aimock test
# does. nextest applies the first matching override, so this precedes the
# family-wide one below.
filter = 'package(=broca-provider) and binary(=it) and test(/^mixed_family_concurrency_e2e::/)'
test-group = 'aimock'
threads-required = 4

[[profile.default.overrides]]
# The provider-family e2e matrix boots one aimock process per test alongside
# the real loop, so cap the whole family. The crate's integration tests share
# one binary, so the family is selected by its modules' test-name prefixes.
# A misspelled prefix selects nothing without an error (unlike binary(=...),
# which nextest rejects when no binary has that name), so
# scripts/test-nextest-groups.py checks each prefix and that every module
# booting aimock is in this group.
filter = 'package(=broca-provider) and binary(=it) and test(/^(all_families_smoke|anthropic_e2e|bedrock_e2e|gemini_e2e|openai_chat_e2e|openai_responses_e2e|stream_errors_e2e|tool_arg_errors_e2e|transport_errors_e2e)::/)'
test-group = 'aimock'
