[package]
name = "broca-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client-facing wire contracts for the broca session management surface."

[dependencies]
broca-core = { path = "../broca-core" }
broca-protocol = { path = "../broca-protocol" }
serde.workspace = true
serde_json.workspace = true
# The role crate provides the types for role.describe answers and steer delivery receipts in
# session.send replies. These types use serde; the workspace version pin keeps them aligned with
# the conformance suite's types.
cortexkit-role-llm-runner = { workspace = true }
cortexkit-role-agent-data.workspace = true

[dev-dependencies]
cortexkit-role-llm-runner = { workspace = true, features = ["test-vectors"] }
serde_jcs.workspace = true
cortexkit-bus-naming.workspace = true
cortexkit-role-agent-data = { workspace = true, features = ["test-vectors"] }
tokio = { workspace = true, features = ["test-util"] }
# Only the golden-bytes tests use it, to print and pin each golden file's digest.
sha2.workspace = true
