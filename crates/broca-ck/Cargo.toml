[package]
name = "broca-ck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# CK-Message is the shared JSON representation for prompt-reduction transforms. It is independent
# of any one consumer's internal message types, so both sides can depend on the same wire contract.

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
broca-protocol = { path = "../broca-protocol" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The wire-golden sha pin (tests/it/ck_wire_golden.rs) hashes the fixture bytes.
sha2.workspace = true
