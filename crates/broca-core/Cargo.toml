[package]
name = "broca-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "broca core: the agentic loop and its seams (provider, tool-plane, lease, approval). Provider- and transport-agnostic — no subc dependency; the subc tool plane is a separate adapter crate."

[features]
test-clock = []
test-attachments = ["broca-protocol/test-attachments"]

[dependencies]
broca-owner-only.workspace = true
broca-diagnostics = { path = "../broca-diagnostics" }
broca-protocol = { path = "../broca-protocol" }
broca-wal = { path = "../broca-wal" }
cortexkit-role-compaction-provider = { workspace = true }
cortexkit-role-step-transform-provider.workspace = true
cortexkit-role-tool-provider.workspace = true
cortexkit-role-llm-runner.workspace = true
# The shared single-writer durable lease (OS advisory lock + monotonic forensic epoch stamp).
cortexkit-lease = { workspace = true }
serde.workspace = true
serde_json.workspace = true
serde_jcs = { workspace = true }
tokio.workspace = true
tracing.workspace = true
# CancellationToken: cooperative run cancellation (a `cancelled()` future the loop and
# the future coordinator can select! on), plus the provider-call watchdog timeout.
tokio-util.workspace = true
async-trait.workspace = true
# join_all for concurrent (source-ordered) parallel tool dispatch.
futures.workspace = true
# The prefix/cache hash over the deterministic provider-rendered request bytes (C7).
sha2.workspace = true
# The random 128-bit id minted at each writer open and stamped in version 4 frame headers.
getrandom = "0.3"

[dev-dependencies]
broca-owner-only = { workspace = true, features = ["test-support"] }
# Test scratch paths live under one owned, self-reclaiming root; see that crate.
broca-test-support = { path = "../broca-test-support" }
# Tests of the paths that copy WAL bytes need a gated frame this build can read; see
# `broca_wal::framing::TEST_KNOWN_FEATURE`.
broca-wal = { path = "../broca-wal", features = ["test-known-feature"] }
# The M9 resume-execution harness implements a step-keyed recording Provider.
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
