[package]
name = "broca-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "broca catalog: resolves models and providers from fusiform's catalog and a hand-maintained overlay into the provider framework's specs, and resolves a model and auth into a runnable provider."

[features]
# Embed the multi-MB vendored snapshot into the binary at compile time. On by
# default for release binaries; tooling/tests that load a snapshot from a string or
# disk can turn it off to avoid linking the JSON into every binary.
default = ["bundled-catalog"]
bundled-catalog = []
# Snapshot replacement bypasses normal refresh validation and is only for test setup.
test-support = []

[dependencies]
# Structured-output types: a fresh episode's request, and the decision frozen from it (how the
# schema is sent and what enforcement is reported) using the model's catalog support.
broca-protocol = { path = "../broca-protocol" }
broca-owner-only.workspace = true
# Sits ABOVE the provider framework: produces the specs the framework consumes, and the
# live resolver (`live.rs`) builds the provider's live transport from them.
broca-provider = { path = "../broca-provider", features = ["live"] }
# The live resolver returns a `Box<dyn Provider>` (core's trait).
broca-core = { path = "../broca-core" }
# Resolves the codex account-id header from the vault or the ChatGPT token.
cortexkit-chatgpt-policy.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[build-dependencies]
# build.rs validates the vendored snapshot parses at build time (fails the build,
# not production, on a malformed snapshot).
serde_json.workspace = true

[dev-dependencies]
broca-catalog = { path = ".", features = ["test-support"] }
broca-module-serve = { path = "../broca-module-serve" }
broca-owner-only = { workspace = true, features = ["test-support"] }
# Shared account-id vectors used by the Codex auth tests.
cortexkit-chatgpt-policy = { workspace = true, features = ["test-vectors"] }
# Test scratch paths live under one owned, self-reclaiming root; see that crate.
broca-test-support = { path = "../broca-test-support" }
# The catalog→live end-to-end test drives a real provider through the loop's
# Provider trait, so it needs a runtime.
tokio = { workspace = true, features = ["test-util"] }
# The mixed-pipe warm proof negotiates the same Responses socket compression as production.
tokio-tungstenite.workspace = true
futures.workspace = true
# Tests build ChatGPT JWTs whose payloads carry each account-id claim shape.
base64 = "0.22"
