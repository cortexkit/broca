[package]
name = "broca-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "broca's SQLite stores: run-index.db (session-ref index, scope reservations, bus outboxes, usage export facts), System One, grants and late results."

[features]
default = []
test-conformance = []

[dependencies]
getrandom = "0.3"
broca-owner-only.workspace = true
broca-core = { path = "../broca-core" }
broca-protocol = { path = "../broca-protocol" }
# The session-ref census reads the session store's heads for the identity each session was
# created under.
broca-session-store = { path = "../broca-session-store" }
broca-records = { path = "../broca-records" }
broca-wal = { path = "../broca-wal" }
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
cortexkit-bus-naming.workspace = true
cortexkit-bus-trait.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
# Bundled SQLite — no system dependency; the persister is sync (runs off the hot
# path), matching rusqlite's blocking API.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# Enable tracing for transaction-completion tests and hooks for recovery-fence tests.
rusqlite = { version = "0.32", features = ["hooks", "trace"] }
broca-owner-only = { workspace = true, features = ["test-support"] }
# Test scratch paths live under one owned, self-reclaiming root; see that crate.
broca-test-support = { path = "../broca-test-support" }
# Tests of the paths that copy WAL bytes need a gated frame this build can read; see
# `broca_wal::framing::TEST_KNOWN_FEATURE`.
broca-wal = { path = "../broca-wal", features = ["test-known-feature", "fs-override"] }
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
