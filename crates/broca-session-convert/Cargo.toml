[package]
name = "broca-session-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Converts today's session logs into broca's new session storage format and measures the result. The only crate that reads both formats."
publish = false

[[bin]]
name = "session-convert"
path = "src/main.rs"

[dependencies]
broca-core = { path = "../broca-core" }
# Today's offline request renderer (`wal_render`), which the `render` check compares the new run
# loop's rebuilt requests with.
broca-module = { path = "../broca-module" }
broca-module-serve = { path = "../broca-module-serve" }
broca-protocol = { path = "../broca-protocol" }
broca-provider = { path = "../broca-provider" }
broca-session-loop = { path = "../broca-session-loop" }
broca-session-store = { path = "../broca-session-store" }
broca-wal = { path = "../broca-wal" }
cortexkit-role-compaction.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
zstd = "0.14"
futures = { workspace = true, features = ["executor"] }

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
