[package]
name = "broca-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lock-free observation of broca-owned blocking jobs and egress"

[dependencies]
tokio.workspace = true
serde.workspace = true

[dev-dependencies]
# Every workspace member declares the same dev Tokio, so building one package after another
# never re-resolves Tokio with different features and recompiles the shared crates
# (scripts/test-dependency-features.py checks this).
tokio = { workspace = true, features = ["test-util"] }
