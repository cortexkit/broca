[package]
name = "ck-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Import foreign harness sessions into a running broca lineage."

[[bin]]
name = "ck-import"
path = "src/main.rs"

[dependencies]
broca-core = { path = "../broca-core" }
broca-module-serve = { path = "../broca-module-serve" }
broca-protocol = { path = "../broca-protocol" }
broca-subc = { path = "../broca-subc" }
ck-session-import = { path = "../ck-session-import" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
# Test scratch paths live under one owned, self-reclaiming root; see that crate.
broca-test-support = { path = "../broca-test-support" }
broca-module = { path = "../broca-module" }
tokio = { workspace = true, features = ["test-util"] }
