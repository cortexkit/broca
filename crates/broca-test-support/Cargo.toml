[package]
name = "broca-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Test-only helpers for the broca workspace: one owned, self-reclaiming scratch root for test temp paths. A dev-dependency only; never a runtime dependency of a shipped binary."
publish = false

[target.'cfg(windows)'.dependencies]
broca-owner-only = { workspace = true, features = ["test-support"] }

[dependencies]
broca-core = { path = "../broca-core", optional = true }
broca-protocol = { path = "../broca-protocol", optional = true }
broca-store = { path = "../broca-store", optional = true }
broca-wal = { path = "../broca-wal", optional = true }
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[features]
session-address = ["dep:broca-core", "dep:broca-protocol", "dep:broca-store", "dep:broca-wal"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"
