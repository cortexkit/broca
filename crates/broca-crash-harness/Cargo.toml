[package]
name = "broca-crash-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Test-only crash-cut harness: runs a scripted scenario against the real run loop, kills it at every WAL record boundary (by truncating a copy of the log) or mid-call (by SIGKILL of a spawned runner), resumes through the real run loop, and asserts the resume invariants. A dev-dependency only; never a runtime dependency of a shipped binary."
publish = false

[dependencies]
broca-core = { path = "../broca-core" }
broca-protocol = { path = "../broca-protocol" }
broca-wal = { path = "../broca-wal", features = ["fs-override"] }
broca-test-support = { path = "../broca-test-support" }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The scope migration test drives the lineage registry the serve layer calls, over the state
# roots the harness leaves.
broca-module = { path = "../broca-module" }
# The role's steer delivery receipt, which the steer kill tests compare across a restart.
cortexkit-role-llm-runner = { workspace = true }
