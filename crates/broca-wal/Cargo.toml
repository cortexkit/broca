[package]
name = "broca-wal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "broca WAL: the intent-log source of truth — framed records (len/ver/seq/fence/SHA-256 digest), the durable record set, and FileWal (append+fsync, torn-tail-safe replay)."

[features]
# Test builds only: makes `framing::TEST_KNOWN_FEATURE` a known WAL feature, so tests in other
# crates can build a gated frame this build reads. Enabled only from dev-dependencies; a
# release build with it fails to compile. See `framing::TEST_KNOWN_FEATURE`.
test-known-feature = []

[dependencies]
broca-owner-only.workspace = true
broca-protocol = { path = "../broca-protocol" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
getrandom = "0.3"

[dev-dependencies]
broca-owner-only = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
# Test scratch paths live under one owned, self-reclaiming root; see that crate.
broca-test-support = { path = "../broca-test-support" }
# RFC 8785 (JCS) canonical JSON, to recompute a stored plan identity independently of the
# writer. Test-only: a reader never canonicalizes the plan.
serde_jcs = "0.2"
