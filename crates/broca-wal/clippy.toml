# WAL library production I/O must pass through fs_ops so power-loss proofs
# observe the actual operations. Only fs_ops suppresses clippy::disallowed_methods
# for the library's real backend. The operator verifier and non-shipping fixture
# crates document their separate report/fixture I/O exceptions at their roots.
